name: Build & publish Homebrew release

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.7.2)
        required: true

jobs:
  brew-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build universal zip
        run: npm run predist && npx electron-builder --mac --universal --publish never

      - name: Collect build info
        id: info
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${VERSION#v}"
          ZIP="release/PR Monitor-${VERSION}-universal-mac.zip"
          SHA=$(shasum -a 256 "${ZIP}" | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload zip to release
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" "${{ steps.info.outputs.zip }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.info.outputs.version }}
          SHA256: ${{ steps.info.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jeanjacquesaka1980/homebrew-tap.git" /tmp/tap
          cd /tmp/tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/pr-monitor.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/pr-monitor.rb

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Casks/pr-monitor.rb
          git commit -m "chore: bump pr-monitor to ${VERSION}"
          git push
